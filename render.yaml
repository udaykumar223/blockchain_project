services:
  - type: web
    name: land-record-backend
    env: node
    plan: free
    buildCommand: npm --prefix backend install
    startCommand: node backend/server.js
    envVars:
      - key: PORT
        value: 5000
      - key: RPC_URL
        value: https://ethereum-sepolia-rpc.publicnode.com
      - key: CONTRACT_ADDRESS
        sync: false
      - key: REGISTRAR_PRIVATE_KEY
        sync: false
